<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Outline</title>

    <style>
        .estilo {
            border: 2px solid black;
            outline-style: dotted;
            padding: 10px;
        }

        .color {
            border: 2px solid black;
            outline-style: solid;
            outline-color: red;
            padding: 10px;
        }

        .ancho {
            border: 2px solid black;
            outline-style: solid;
            outline-color: blue;
            outline-width: 5px;
            padding: 10px;
        }

        .abreviado {
            border: 2px solid black;
            outline: 4px dashed green;
            padding: 10px;
        }

        .separado {
            border: 2px solid black;
            outline: 3px solid purple;
            outline-offset: 8px;
            padding: 10px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Contornos en CSS</h1>

    <p class="estilo">
        Este elemento tiene un contorno punteado.
    </p>

    <p class="color">
        Este elemento tiene un contorno rojo.
    </p>

    <p class="ancho">
        Este elemento tiene un contorno azul de 5 píxeles.
    </p>

    <p class="abreviado">
        Este elemento utiliza la propiedad abreviada outline.
    </p>

    <p class="separado">
        Este contorno está separado del borde mediante outline-offset.
    </p>

</body>
</html>
