<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS How To</title>

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: navy;
            text-align: center;
        }

        p {
            color: darkgreen;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>CSS interno</h1>

    <p>
        Este párrafo recibe estilos desde el bloque style
        ubicado dentro del elemento head.
    </p>

    <h2 style="color: red;">
        Este encabezado utiliza CSS en línea
    </h2>

</body>
</html>
