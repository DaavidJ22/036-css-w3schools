<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Align</title>

    <style>
        .centrado {
            width: 50%;
            margin: auto;
            border: 3px solid green;
            padding: 10px;
        }

        .texto-centrado {
            text-align: center;
            border: 3px solid blue;
            padding: 10px;
            margin-top: 20px;
        }

        .derecha {
            width: 300px;
            margin-left: auto;
            border: 3px solid red;
            padding: 10px;
            margin-top: 20px;
        }

        .flex {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150px;
            border: 3px solid purple;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Alineación en CSS</h1>

    <div class="centrado">
        Este elemento está centrado horizontalmente con margin: auto.
    </div>

    <div class="texto-centrado">
        Este texto está centrado con text-align: center.
    </div>

    <div class="derecha">
        Este elemento está alineado a la derecha.
    </div>

    <div class="flex">
        Este contenido está centrado vertical y horizontalmente.
    </div>

</body>
</html>
