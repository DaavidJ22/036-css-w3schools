<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Padding</title>

    <style>
        .padding-general {
            border: 2px solid red;
            padding: 40px;
        }

        .padding-individual {
            border: 2px solid blue;
            padding-top: 20px;
            padding-right: 60px;
            padding-bottom: 40px;
            padding-left: 80px;
        }

        .padding-abreviado {
            border: 2px solid green;
            padding: 20px 40px 60px 80px;
        }

        .dos-valores {
            border: 2px solid purple;
            padding: 20px 50px;
        }
    </style>
</head>

<body>

    <h1>Padding en CSS</h1>

    <p class="padding-general">
        Este elemento tiene un padding de 40 píxeles en todos sus lados.
    </p>

    <p class="padding-individual">
        Este elemento tiene un padding diferente en cada lado.
    </p>

    <p class="padding-abreviado">
        Este elemento utiliza cuatro valores en la propiedad padding.
    </p>

    <p class="dos-valores">
        Este elemento utiliza padding vertical y horizontal.
    </p>

</body>
</html>
