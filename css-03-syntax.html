<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Syntax</title>

    <style>
        p {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Sintaxis de CSS</h1>

    <p>Este párrafo está centrado y tiene color rojo.</p>

    <p>Todos los elementos p reciben las mismas declaraciones CSS.</p>

</body>
</html>
