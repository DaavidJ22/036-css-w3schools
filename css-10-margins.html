<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Margins</title>

    <style>
        .margen-general {
            border: 2px solid red;
            margin: 40px;
        }

        .margenes-individuales {
            border: 2px solid blue;
            margin-top: 20px;
            margin-right: 60px;
            margin-bottom: 40px;
            margin-left: 80px;
        }

        .margen-abreviado {
            border: 2px solid green;
            margin: 20px 40px 60px 80px;
        }

        .centrado {
            width: 300px;
            margin: auto;
            border: 2px solid purple;
        }
    </style>
</head>

<body>

    <h1>Márgenes en CSS</h1>

    <p class="margen-general">
        Este elemento tiene un margen de 40 píxeles en todos sus lados.
    </p>

    <p class="margenes-individuales">
        Este elemento tiene un margen diferente en cada lado.
    </p>

    <p class="margen-abreviado">
        Este elemento utiliza la propiedad abreviada margin.
    </p>

    <div class="centrado">
        Este elemento está centrado horizontalmente con margin auto.
    </div>

</body>
</html>
