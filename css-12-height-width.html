<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Height and Width</title>

    <style>
        .tamanio-fijo {
            width: 300px;
            height: 150px;
            background-color: lightblue;
            border: 2px solid blue;
        }

        .tamanio-porcentaje {
            width: 50%;
            height: 100px;
            background-color: lightgreen;
            border: 2px solid green;
        }

        .maximo {
            max-width: 500px;
            height: 120px;
            background-color: lightcoral;
            border: 2px solid red;
        }
    </style>
</head>

<body>

    <h1>Alto y ancho en CSS</h1>

    <div class="tamanio-fijo">
        Este elemento tiene ancho y alto definidos en píxeles.
    </div>

    <br>

    <div class="tamanio-porcentaje">
        Este elemento tiene un ancho del 50%.
    </div>

    <br>

    <div class="maximo">
        Este elemento tiene un ancho máximo de 500 píxeles.
    </div>

</body>
</html>
