<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Tables</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: lightblue;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: lightyellow;
        }

        caption {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h1>Tablas con CSS</h1>

    <table>
        <caption>Estudiantes</caption>

        <tr>
            <th>Nombre</th>
            <th>Curso</th>
            <th>Nota</th>
        </tr>

        <tr>
            <td>Jeason</td>
            <td>Programación Web</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Ana</td>
            <td>Base de Datos</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Carlos</td>
            <td>Sistemas Operativos</td>
            <td>88</td>
        </tr>
    </table>

</body>
</html>
