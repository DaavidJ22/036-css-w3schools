<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Colors</title>

    <style>
        h1 {
            color: Tomato;
        }

        .fondo {
            background-color: DodgerBlue;
            color: white;
            padding: 10px;
        }

        .borde {
            border: 2px solid Violet;
            padding: 10px;
        }

        .rgb {
            color: rgb(255, 99, 71);
        }

        .hex {
            color: #ff6347;
        }

        .hsl {
            color: hsl(9, 100%, 64%);
        }

        .rgba {
            background-color: rgba(255, 99, 71, 0.5);
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Colores en CSS</h1>

    <p class="fondo">
        Este texto utiliza color de fondo.
    </p>

    <p class="borde">
        Este párrafo tiene un borde de color.
    </p>

    <p class="rgb">
        Color definido con RGB.
    </p>

    <p class="hex">
        Color definido con HEX.
    </p>

    <p class="hsl">
        Color definido con HSL.
    </p>

    <p class="rgba">
        Fondo definido con RGBA.
    </p>

</body>
</html>
