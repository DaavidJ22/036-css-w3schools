<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Selectors</title>

    <style>
        * {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        #parrafoPrincipal {
            color: red;
            text-align: center;
        }

        .destacado {
            background-color: yellow;
        }

        p.centrado {
            text-align: center;
            color: green;
        }

        h2, h3 {
            color: purple;
        }
    </style>
</head>

<body>

    <h1>Selectores CSS</h1>

    <p id="parrafoPrincipal">
        Este párrafo utiliza un selector de identificador.
    </p>

    <p class="destacado">
        Este párrafo utiliza un selector de clase.
    </p>

    <p class="centrado">
        Este párrafo utiliza un selector de elemento y clase.
    </p>

    <h2>Selector agrupado</h2>

    <h3>Este encabezado comparte el mismo estilo.</h3>

</body>
</html>
