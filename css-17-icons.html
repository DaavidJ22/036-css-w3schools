<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Icons</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .icono-azul {
            color: blue;
            font-size: 30px;
        }

        .icono-rojo {
            color: red;
            font-size: 40px;
        }

        .icono-verde {
            color: green;
            font-size: 50px;
        }
    </style>
</head>

<body>

    <h1>Iconos en CSS</h1>

    <i class="fa fa-home icono-azul"></i>

    <i class="fa fa-heart icono-rojo"></i>

    <i class="fa fa-car icono-verde"></i>

    <i class="fa fa-cloud"></i>

    <i class="fa fa-bars"></i>

</body>
</html>
