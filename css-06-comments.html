<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Comments</title>

    <style>
        /* Estilo general de la página */
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }

        /* Estilo del encabezado principal */
        h1 {
            color: darkblue;
            text-align: center;
        }

        p {
            color: green; /* Color del texto */
            font-size: 18px;
        }

        /*
        Este comentario ocupa
        varias líneas.
        */
    </style>
</head>

<body>

    <h1>Comentarios en CSS</h1>

    <p>
        Los comentarios sirven para explicar el código y no aparecen
        en la página web.
    </p>

</body>
</html>
